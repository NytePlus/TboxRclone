services:
  go-tests:
    image: golang:1.26.0-bookworm@sha256:2a0ba12e116687098780d3ce700f9ce3cb340783779646aafbabed748fa6677c
    working_dir: /src
    entrypoint: [sh, /src/scripts/with-rclone-patches.sh]
    volumes:
      - .:/src
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      RCLONE_CONFIG: /nonexistent
    command: [go, test, -race, ./...]
  webdav:
    profiles: [live]
    image: golang:1.26.0-bookworm@sha256:2a0ba12e116687098780d3ce700f9ce3cb340783779646aafbabed748fa6677c
    working_dir: /src
    entrypoint: [sh, /src/scripts/with-rclone-patches.sh]
    volumes:
      - .:/src:ro
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - ./.secrets:/secrets:ro
      - ./.state:/state
    environment:
      RCLONE_SJTU_OWNERSHIP_DIR: /state/owners
      RCLONE_LOG_LEVEL: '${TBOX_LOG_LEVEL:-NOTICE}'
      RCLONE_SJTU_LAB_OVERWRITE: '${TBOX_LAB_OVERWRITE:-false}'
      RCLONE_SJTU_LAB_DELETE: '${TBOX_LAB_DELETE:-false}'
      RCLONE_SJTU_LAB_MOVE: '${TBOX_LAB_MOVE:-false}'
    ports:
      - 127.0.0.1:8686:8686
    command: [sh, /src/scripts/run-go-service.sh, tboxrclone, serve, webdav, '${TBOX_LAB_REMOTE:-sjtu:}', --config, /secrets/rclone.conf, --addr, ':8686', --vfs-cache-mode, 'off', --exclusive-access, --no-recursive-delete, --cache-dir, /state/vfs]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --request, OPTIONS, http://127.0.0.1:8686/]
      interval: 5s
      timeout: 2s
      retries: 30
  fault-proxy:
    profiles: [faults]
    image: golang:1.26.0-bookworm@sha256:2a0ba12e116687098780d3ce700f9ce3cb340783779646aafbabed748fa6677c
    working_dir: /src
    entrypoint: [sh, /src/scripts/with-rclone-patches.sh]
    volumes:
      - .:/src:ro
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - ./.state:/state
    ports:
      - 127.0.0.1:8687:8686
    command: [sh, /src/scripts/run-go-service.sh, faultproxy, --ca-file, /state/faultproxy-ca.pem, --allow-hosts, '${TBOX_FAULT_HOSTS:-pan.sjtu.edu.cn:443}']
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8788/events]
      interval: 2s
      timeout: 2s
      retries: 60
  webdav-faults:
    profiles: [faults]
    image: golang:1.26.0-bookworm@sha256:2a0ba12e116687098780d3ce700f9ce3cb340783779646aafbabed748fa6677c
    working_dir: /src
    entrypoint: [sh, /src/scripts/with-rclone-patches.sh]
    network_mode: service:fault-proxy
    depends_on:
      fault-proxy:
        condition: service_healthy
    volumes:
      - .:/src:ro
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - ./.secrets:/secrets:ro
      - ./.state:/state
    environment:
      RCLONE_SJTU_OWNERSHIP_DIR: /state/owners
      HTTPS_PROXY: http://127.0.0.1:8787
      NO_PROXY: ''
      SSL_CERT_FILE: /state/faultproxy-ca.pem
    command: [sh, /src/scripts/run-go-service.sh, tboxrclone, serve, webdav, '${TBOX_LAB_REMOTE:-sjtu:codex-api-lab/fault-run}', --config, /secrets/rclone.conf, --addr, ':8686', --vfs-cache-mode, 'off', --exclusive-access, --no-recursive-delete, --cache-dir, /state/vfs]
  fault-client:
    profiles: [faults]
    image: golang:1.26.0-bookworm@sha256:2a0ba12e116687098780d3ce700f9ce3cb340783779646aafbabed748fa6677c
    working_dir: /src
    entrypoint: [sh, /src/scripts/with-rclone-patches.sh]
    network_mode: service:fault-proxy
    depends_on:
      fault-proxy:
        condition: service_healthy
    volumes:
      - .:/src:ro
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - ./.secrets:/secrets:ro
      - ./.state:/state
    environment:
      RCLONE_SJTU_OWNERSHIP_DIR: /state/owners
      HTTPS_PROXY: http://127.0.0.1:8787
      NO_PROXY: ''
      SSL_CERT_FILE: /state/faultproxy-ca.pem
    command: [go, test, -race, ./...]
volumes:
  go-modules:
  go-build:
