# Code-driven performance experiments; never mounts or controls Finder.
services:
  performance-webdav:
    extends:
      file: docker-compose.yml
      service: webdav
    profiles: [performance]
    ports: !override
      - 127.0.0.1:8688:8686
    environment:
      RCLONE_SJTU_OWNERSHIP_DIR: /state/owners-${TBOX_PERF_RUN_ID:?set isolated performance run id}
      RCLONE_CONFIG_SJTU_STATE_DIR: /state/${TBOX_PERF_RUN_ID:?set isolated performance run id}
      RCLONE_SJTU_MAX_UPLOAD: 2G
      RCLONE_SJTU_MAX_SPOOL: 4G
      RCLONE_LOG_LEVEL: INFO
      RCLONE_SJTU_LAB_OVERWRITE: 'false'
      RCLONE_SJTU_LAB_DELETE: 'false'
      RCLONE_SJTU_LAB_MOVE: 'false'
    dns: [10.253.253.2]
    networks: [default, lab-dns]
    depends_on: [lab-dns]
    command: [sh, /src/scripts/run-go-service.sh, tboxrclone, serve, webdav, 'sjtu:codex-api-lab/${TBOX_PERF_RUN_ID:?set isolated performance run id}', --config, /secrets/rclone-finder.conf, --addr, ':8686', --vfs-cache-mode, 'off', --dir-cache-time, '5s', --no-recursive-delete, --cache-dir, /state/performance-vfs]
